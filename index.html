<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f8fc"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>안약 기록</title><style>

kground:#218c80;color:white;padding:13px 20px;font-weight:750;width:100%;margin-top:8px}.secondary{background:#eef4f7;color:#42546c}.note{font-size:13px;line-height:1.65;color:#718096}.historyrow{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #f0f2f5;font-size:14px}.historyrow:last-child{border-bottom:0}.empty{padding:28px 8px;text-align:center;color:#8390a0}.section-title{font-size:18px;font-weight:800;margin:0 0 12px}.pill{background:#e7f5ef;color:#228274;padding:6px 10px;border-radius:12px;font-size:12px;font-weight:800}.warn{background:#fff9e9;border-radius:14px;padding:12px 14px;color:#86652c;font-size:13px;line-height:1.6;margin-top:12px}
